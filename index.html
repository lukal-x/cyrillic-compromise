<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Univerzalni Ćirilični Preslovljivač</title>
</head>
<body>

    <h1>Univerzalni Ćirilični Preslovljivač</h1>
    <hr>

    <div>
        <label for="languageSelect"><b>1. Izaberi jezik / jezičku grupu:</b></label><br>
        <select id="languageSelect">
            <option value="balkan">Balkanski jezici (MKD / SLO / CG / BHS)</option>
            <option value="bulgarian">Bugarski (BG)</option>
            <option value="greek">Grčki (GR)</option>
            <option value="czech_slovak">Češki / Slovački (CZ / SK)</option>
            <option value="polish_sorbian">Poljski / Lužičkosrpski (PL)</option>
            <option value="romance_cyrillic">Rumunska ćirilica (RO)</option>
            <option value="eastern">Istočna ćirilica (RUS / BLR)</option>
            <option value="caucasian">Kavkaski jezici</option>
            <option value="uralic">Uralski jezici</option>
            <option value="kazakh">Kazahstanski (KZ)</option>
            <option value="mongolian">Mongolski (MNG)</option>
            <option value="iranic_central_asia">Iranski jezici (Srednja Azija)</option>
        </select>
    </div>

    <br>

    <div>
        <label for="inputText"><b>2. Unesi / nalepi originalni tekst:</b></label><br>
        <textarea id="inputText" rows="12" cols="90" placeholder="Ovde nalepi tekst za preslovljavanje..."></textarea>
    </div>

    <br>

    <div>
        <button id="runBtn" style="padding: 8px 16px; cursor: pointer; font-weight: bold;">Preslovi tekst ↑↓</button>
    </div>

    <br>

    <div>
        <label for="outputText"><b>3. Rezultat (Unifikovana ukrajinska ćirilica):</b></label><br>
        <textarea id="outputText" rows="12" cols="90" readonly placeholder="Rezultat će se pojaviti ovde nakon klika na dugme..."></textarea>
    </div>

    <script type="module">
        import { UniversalTransliterator } from './cyrillic.js';

        const transliterator = new UniversalTransliterator();

        document.getElementById('runBtn').addEventListener('click', function() {
            const languageGroup = document.getElementById('languageSelect').value;
            const text = document.getElementById('inputText').value;
            const outputArea = document.getElementById('outputText');

            if (!text.trim()) {
                outputArea.value = "Molimo unesite tekst.";
                return;
            }

            try {
                const result = transliterator.transliterate(text, languageGroup);
                outputArea.value = result;
            } catch (error) {
                outputArea.value = "Greška u izvršavanju:\n" + error.message;
            }
        });
    </script>

</body>
</html>
