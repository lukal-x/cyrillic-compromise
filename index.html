<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Універзалні Цьірілічні пресловльівач</title>
</head>
<body>

    <h1>Універзалні Цьірілічні пресловльівач</h1>
    <hr>

    <div>
        <label for="languageSelect"><b>1. Ізабері єзік / єзічку групу:</b></label><br>
        <select id="languageSelect">
            <option value="balkan">Балканскі єзіці (МКД / СЛО / ЦГ / БХС)</option>
            <option value="rusyn">Русінскі (РУС)</option>
            <option value="bulgarian">Бугарскі (БГ)</option>
            <option value="greek">Грчкі (ГР)</option>
            <option value="czech_slovak">Чешкі / Словачкі (ЦЗ / СК)</option>
            <option value="polish_sorbian">Польскі / Лужічкосрпскі (ПЛ)</option>
            <option value="romance_cyrillic">Румунска цьіріліца (РО)</option>
            <option value="eastern">Істочна цьіріліца (РУ / БЛР)</option>
            <option value="caucasian">Кавкаскі єзіці</option>
            <option value="uralic">Уралскі єзіці</option>
            <option value="kazakh">Казахстанскі (КЗ)</option>
            <option value="mongolian">Монголскі (МНГ)</option>
            <option value="iranic_central_asia">Іранскі єзіці (Средня Азія)</option>
        </select>
    </div>

    <br>

    <div>
        <label for="inputText"><b>2. Унесі / налепі орігіналні текст:</b></label><br>
        <textarea id="inputText" rows="12" cols="90" placeholder="Овде налепі текст за пресловляванє..."></textarea>
    </div>

    <br>

    <div>
        <button id="runBtn" style="padding: 8px 16px; cursor: pointer; font-weight: bold;">Преслові текст ↑↓</button>
    </div>

    <br>

    <div>
        <label for="outputText"><b>3. Резултат (Уніфікована украйінска цьіріліца):</b></label><br>
        <textarea id="outputText" rows="12" cols="90" readonly placeholder="Резултат цье се появіті овде након кліка на дугме..."></textarea>
    </div>

    <script type="module">
        import { UniversalTransliterator } from './cyrillic.js';

        const transliterator = new UniversalTransliterator();

        document.getElementById('runBtn').addEventListener('click', function() {
            const languageGroup = document.getElementById('languageSelect').value;
            const text = document.getElementById('inputText').value;
            const outputArea = document.getElementById('outputText');

            if (!text.trim()) {
                outputArea.value = "Молімо унесіте текст.";
                return;
            }

            try {
                const result = transliterator.transliterate(text, languageGroup);
                outputArea.value = result;
            } catch (error) {
                outputArea.value = "Грешка у ізвршаваню:\n" + error.message;
            }
        });
    </script>

</body>
</html>
